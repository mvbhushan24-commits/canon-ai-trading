# Application metadata
app:
  name: "Canon AI Trading"
  version: "0.1.0"
  symbol: "GOLD.i#"
  broker: "XMGlobal"

# Market Data Engine configuration (Sprint 1)
market_data:
  symbol: "GOLD.i#"
  broker: "XMGlobal"
  timeframes:
    - M1
    - M5
    - M15
    - M30
    - H1
    - H4
    - D1
  tick_enabled: true
  history_bars: 500
  stale_threshold_sec: 30

# Engine toggles (future sprints)
engines:
  market_data: true
  market_structure: false
  smart_money: false
  liquidity: false
  trend: false
  price_action: false
  macro_events: false
  news: false
  volatility: false
  risk: false
  decision: false
  notification: false

# Logging
logging:
  level: "INFO"
